---
# Образец конфига. Положить в ~/.config/alimony/config.yaml и заполнить своими данными.
# Правовые основания каждого поля разобраны в docs/LEGAL.md.

# --- Доход ---------------------------------------------------------------
#
# Простой случай — постоянный доход одним числом:
#
#   net_income: 100000
#
# Полный вариант: история по периодам с точностью до дня. Смена работодателя и
# перерывы между работами приходятся на середину месяца, поэтому даты, а не месяцы.
# Начисление за месяц собирается из отрезков пропорционально календарным дням.
#
# Дыр в истории быть не должно: каждый день от первого периода до сегодня обязан
# быть чем-то закрыт. Молчаливый пропуск — самый лёгкий способ получить сюрприз,
# поэтому он считается ошибкой конфига.
#
# Суммы — чистый доход после НДФЛ. Учитывать надо не только оклад: премии,
# отпускные, больничные, доходы от аренды и самозанятости входят в базу удержания
# по перечню, утверждённому постановлением Правительства РФ от 02.11.2021 № 1908.
income:
  - from: '01.09.2024'
    to: '05.04.2026'
    net_monthly: 140000

  # Период без заработка. За эти дни пристав считает задолженность исходя
  # из средней зарплаты по РФ (п. 4 ст. 113 СК РФ).
  #
  # Если в этот период вы стояли на учёте в центре занятости, средняя зарплата
  # не применяется: алименты удерживаются с пособия по безработице. Тогда вместо
  # unemployed укажите net_monthly с размером пособия.
  - from: '06.04.2026'
    to: '27.04.2026'
    unemployed: true

  # Последний период можно оставить открытым — он действует по сегодня.
  - from: '28.04.2026'
    net_monthly: 210000

# Средняя зарплата по РФ для дней без заработка. Обязательна, если есть периоды
# с unemployed. Берётся на момент взыскания, а не историческая за тот год —
# так требует п. 4 ст. 113 СК РФ, и именно поэтому старые долги вырастают.
# Значение стоит взять из постановления пристава, чтобы воспроизвести его расчёт.
average_wage: 87000

# Фактический доход за отдельные месяцы, если он известен точнее, чем даёт
# расчёт по ставке и дням. Перекрывает расчёт по периодам. Необязательно.
# income_actual:
#   '04.2026': 152300

# Удержания по неалиментным исполнительным производствам, % от дохода.
# Необязательное поле, по умолчанию 0.
other_withholding_percent: 0.0

# --- Дети и исполнительные производства ----------------------------------
children:
  - surname: 'Иванов'
    name: 'Иван'
    patronymic: 'Иванович'
    # Дата рождения: ДД.ММ.ГГГГ или ГГГГ-ММ-ДД.
    # По ней считается совершеннолетие — с ним текущий платёж прекращается
    # (абз. 2 п. 2 ст. 120 СК РФ), и всё удержание уходит в счёт задолженности.
    birthday: '30.11.2006'
    alimony:
      # Весь процент, который удерживается по этому ИП: текущий платёж плюс долг.
      total_percent: 40.0
      # Текущий платёж как доля заработка (п. 1 ст. 81 СК РФ).
      alimony_percent: 25.0
      # Альтернатива для алиментов в твёрдой денежной сумме (ст. 83 СК РФ):
      # вместо alimony_percent укажите сумму в рублях. Её нужно обновлять вручную
      # после каждой индексации по прожиточному минимуму (ст. 117 СК РФ).
      # alimony_fixed: 15000
      # Задолженность, руб. Необязательное поле, по умолчанию 0.
      debt: 200000
      # Дата, на которую посчитана задолженность — из постановления пристава
      # о расчёте задолженности (ст. 113 СК РФ). Обязательна, если debt > 0.
      debt_as_of: '01.03.2026'
      # С какой даты взыскиваются алименты по этому ИП. Нужна для помесячной
      # выгрузки, чтобы не начислять за месяцы до его возбуждения. Необязательно:
      # без неё выгрузка начинается с первого периода в истории дохода.
      started_at: '01.09.2024'

  - surname: 'Петров'
    name: 'Пётр'
    patronymic: 'Петрович'
    birthday: '08.05.2009'
    # Фактическая дата прекращения обязательства, если оно прекратилось раньше 18 лет:
    # эмансипация (ст. 27 ГК РФ), брак до совершеннолетия (п. 2 ст. 21 ГК РФ),
    # усыновление ребёнка другим лицом (ст. 120 СК РФ). Необязательное поле.
    # obligation_ended: '01.03.2026'
    #
    # Нетрудоспособный ребёнок: обязательство не прекращается с совершеннолетием
    # (ст. 85 СК РФ). Взыскивается в твёрдой сумме, то есть вместе с alimony_fixed.
    # disabled: true
    alimony:
      total_percent: 30.0
      alimony_percent: 16.67
      debt: 100000
      debt_as_of: '01.03.2026'
      started_at: '01.09.2024'

  # Прекращённое производство: удержаний нет, долга нет. Запись можно оставить
  # в конфиге как историю — в расчёт и в выгрузку она не входит.
  - surname: 'Сидоров'
    name: 'Сидор'
    patronymic: 'Сидорович'
    birthday: '01.01.2000'
    alimony:
      closed: true
